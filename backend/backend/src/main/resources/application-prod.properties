# Production. Activate with SPRING_PROFILES_ACTIVE=prod.
# CORS_ALLOWED_ORIGINS must list the real frontend origin(s); there is no localhost default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# Behind a reverse proxy, trust X-Forwarded-* so rate limiting sees the real client address.
server.forward-headers-strategy=native
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
logging.level.com.backend.backend=INFO
