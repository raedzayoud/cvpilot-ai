spring.application.name=cvpilot-backend

# Local secrets live in backend/backend/.env (gitignored, KEY=VALUE lines). Real environment
# variables always win over the file. See .env.example. The extra paths make the file resolve
# whether the app runs from the module, the IntelliJ project root, or the repository root.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:file:backend/backend/.env[.properties]
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# ---------- Database (PostgreSQL + Flyway) ----------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cvpilot}
spring.datasource.username=${DB_USERNAME:cvpilot}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Request limits ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
app.limits.max-json-body-bytes=1048576

# ---------- CORS (comma-separated trusted frontend origins) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ---------- AI provider (Groq) ----------
app.ai.groq.api-key=${GROQ_API_KEY:}
app.ai.groq.model=${GROQ_MODEL:openai/gpt-oss-20b}
app.ai.groq.reasoning-effort=${GROQ_REASONING_EFFORT:low}
app.ai.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
app.ai.groq.connect-timeout=5s
app.ai.groq.read-timeout=${GROQ_READ_TIMEOUT:60s}
app.ai.groq.max-retries=1
app.ai.max-input-chars=24000
# Server-wide cap on AI calls per UTC day, to protect the provider quota.
app.ai.daily-request-limit=${AI_DAILY_REQUEST_LIMIT:500}
# Per-client cap on AI-backed endpoints (CV upload, job parsing, chat).
app.rate-limit.ai-requests=${AI_RATE_LIMIT_REQUESTS:20}
app.rate-limit.ai-window=${AI_RATE_LIMIT_WINDOW:10m}

# ---------- PDF export (LaTeX template compiled with Tectonic) ----------
# Path to the tectonic executable; "tectonic" means it is on the PATH. First run downloads its package bundle.
app.latex.enabled=${LATEX_ENABLED:true}
app.latex.compiler=${LATEX_COMPILER:tectonic}
app.latex.timeout=${LATEX_TIMEOUT:120s}

# ---------- API docs ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.com.backend.backend=INFO
